<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>BlogSpace - Register</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <nav>

        <h2>BlogSpace</h2>

        <div>

            <a href="index.html">
                Home
            </a>

            <a href="login.html">
                Login
            </a>

        </div>

    </nav>


    <!-- ================= REGISTER ================= -->

    <main class="container">

        <div class="form-container">

            <h1>Create Account</h1>

            <p style="
                text-align: center;
                color: #777080;
                margin-bottom: 25px;
            ">
                Join BlogSpace and start sharing your ideas
            </p>


            <!-- MESSAGE -->

            <div
                id="message"
                class="message"
            ></div>


            <!-- REGISTER FORM -->

            <form id="registerForm">

                <!-- NAME -->

                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        minlength="6"
                        required
                    >

                </div>


                <!-- CONFIRM PASSWORD -->

                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Confirm your password"
                        minlength="6"
                        required
                    >

                </div>


                <!-- REGISTER BUTTON -->

                <button
                    type="submit"
                    class="btn"
                >
                    Create Account
                </button>

            </form>


            <!-- LOGIN LINK -->

            <div class="form-footer">

                <p>
                    Already have an account?
                    <a href="login.html">
                        Login here
                    </a>
                </p>

            </div>

        </div>

    </main>


    <!-- ================= FOOTER ================= -->

    <footer>

        <h3>
            BlogSpace
        </h3>

        <p>
            Share. Write. Connect.
        </p>

        <p>
            © 2026 BlogSpace. All rights reserved.
        </p>

    </footer>


    <!-- ================= JAVASCRIPT ================= -->

    <script src="js/auth.js"></script>

</body>

</html>
