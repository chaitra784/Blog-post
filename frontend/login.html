<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>BlogSpace - Login</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <nav>

        <h2>BlogSpace</h2>

        <div>
            <a href="index.html">Home</a>
            <a href="register.html">Register</a>
        </div>

    </nav>


    <!-- ================= LOGIN ================= -->

    <main class="container">

        <div class="form-container">

            <h1>Welcome Back</h1>

            <p style="
                text-align: center;
                color: #777080;
                margin-bottom: 25px;
            ">
                Login to continue to BlogSpace
            </p>


            <!-- MESSAGE -->

            <div
                id="message"
                class="message"
            ></div>


            <!-- LOGIN FORM -->

            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="btn"
                >
                    Login
                </button>

            </form>


            <!-- REGISTER LINK -->

            <div class="form-footer">

                <p>
                    Don't have an account?
                    <a href="register.html">
                        Create an account
                    </a>
                </p>

            </div>

        </div>

    </main>


    <!-- ================= FOOTER ================= -->

    <footer>

        <h3>
            BlogSpace
        </h3>

        <p>
            Share. Write. Connect.
        </p>

        <p>
            © 2026 BlogSpace. All rights reserved.
        </p>

    </footer>


    <!-- ================= JAVASCRIPT ================= -->

    <script src="js/auth.js"></script>

</body>

</html>
