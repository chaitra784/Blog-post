<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>BlogSpace - Create Post</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <nav>

        <h2>BlogSpace</h2>

        <div>

            <a href="index.html">
                Home
            </a>

            <a href="create-post.html">
                Create Post
            </a>

            <a href="my-posts.html">
                My Posts
            </a>

            <a
                href="login.html"
                id="loginLink"
            >
                Login
            </a>

            <button
                id="logoutBtn"
                onclick="logout()"
                style="display: none;"
            >
                Logout
            </button>

        </div>

    </nav>


    <!-- ================= CREATE POST ================= -->

    <main class="container">

        <div class="form-container">

            <h1>Create New Post</h1>

            <p style="
                text-align: center;
                color: #777080;
                margin-bottom: 25px;
            ">
                Share your thoughts and ideas with the community.
            </p>


            <!-- MESSAGE -->

            <div
                id="message"
                class="message"
            ></div>


            <!-- FORM -->

            <form id="createPostForm">

                <!-- TITLE -->

                <div class="form-group">

                    <label for="title">
                        Post Title
                    </label>

                    <input
                        type="text"
                        id="title"
                        name="title"
                        placeholder="Enter your post title"
                        maxlength="255"
                        required
                    >

                </div>


                <!-- CONTENT -->

                <div class="form-group">

                    <label for="content">
                        Post Content
                    </label>

                    <textarea
                        id="content"
                        name="content"
                        placeholder="Write your post here..."
                        required
                    ></textarea>

                </div>


                <!-- BUTTONS -->

                <button
                    type="submit"
                    class="btn"
                >
                    Publish Post
                </button>

            </form>


            <!-- BACK -->

            <div class="form-footer">

                <p>
                    <a href="index.html">
                        ← Back to Home
                    </a>
                </p>

            </div>

        </div>

    </main>


    <!-- ================= FOOTER ================= -->

    <footer>

        <h3>
            BlogSpace
        </h3>

        <p>
            Share. Write. Connect.
        </p>

        <p>
            © 2026 BlogSpace. All rights reserved.
        </p>

    </footer>


    <!-- ================= JAVASCRIPT ================= -->

    <script>

        const token =
            localStorage.getItem("token");


        // Check login

        if (!token) {

            window.location.href =
                "login.html";
        }


        // Navbar

        const loginLink =
            document.getElementById(
                "loginLink"
            );

        const logoutBtn =
            document.getElementById(
                "logoutBtn"
            );


        if (token) {

            loginLink.style.display =
                "none";

            logoutBtn.style.display =
                "inline-block";
        }


        // Logout

        function logout() {

            localStorage.removeItem(
                "token"
            );

            localStorage.removeItem(
                "user"
            );

            window.location.href =
                "login.html";
        }


        // Create Post

        const form =
            document.getElementById(
                "createPostForm"
            );


        form.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                const title =
                    document
                        .getElementById("title")
                        .value
                        .trim();


                const content =
                    document
                        .getElementById("content")
                        .value
                        .trim();


                const message =
                    document.getElementById(
                        "message"
                    );


                if (!title || !content) {

                    message.className =
                        "message error";

                    message.textContent =
                        "Title and content are required.";

                    return;
                }


                try {

                    const response =
                        await fetch(
                            "/api/posts",
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json",

                                    "Authorization":
                                        `Bearer ${token}`
                                },

                                body:
                                    JSON.stringify({
                                        title,
                                        content
                                    })
                            }
                        );


                    const data =
                        await response.json();


                    if (
                        response.status === 401
                    ) {

                        localStorage.removeItem(
                            "token"
                        );

                        localStorage.removeItem(
                            "user"
                        );

                        window.location.href =
                            "login.html";

                        return;
                    }


                    if (
                        !response.ok ||
                        !data.success
                    ) {

                        message.className =
                            "message error";

                        message.textContent =
                            data.message ||
                            "Failed to create post.";

                        return;
                    }


                    message.className =
                        "message success";

                    message.textContent =
                        "Post published successfully!";


                    form.reset();


                    setTimeout(() => {

                        window.location.href =
                            "index.html";

                    }, 1000);


                } catch (error) {

                    console.error(error);

                    message.className =
                        "message error";

                    message.textContent =
                        "Unable to connect to server.";
                }

            }
        );

    </script>

</body>

</html>
