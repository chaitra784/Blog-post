<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>BlogSpace - Post</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <nav>

        <h2>BlogSpace</h2>

        <div>

            <a href="index.html">
                Home
            </a>

            <a href="create-post.html">
                Create Post
            </a>

            <a href="my-posts.html">
                My Posts
            </a>

            <a
                href="login.html"
                id="loginLink"
            >
                Login
            </a>

            <button
                id="logoutBtn"
                onclick="logout()"
                style="display: none;"
            >
                Logout
            </button>

        </div>

    </nav>


    <!-- ================= MAIN ================= -->

    <main class="container">

        <!-- POST -->

        <article
            id="postContainer"
            class="post-details"
        >

            <div class="loading">
                Loading post...
            </div>

        </article>


        <!-- COMMENTS -->

        <section class="comments-section">

            <h2>
                Comments
            </h2>


            <!-- ADD COMMENT -->

            <div
                class="comment-form"
                id="commentForm"
                style="display: none;"
            >

                <textarea
                    id="commentInput"
                    placeholder="Write your comment..."
                ></textarea>

                <button
                    class="btn"
                    onclick="addComment()"
                >
                    Add Comment
                </button>

            </div>


            <!-- LOGIN MESSAGE -->

            <div
                id="loginMessage"
                class="alert alert-info"
            >
                Please
                <a href="login.html">
                    login
                </a>
                to add a comment.
            </div>


            <!-- COMMENTS LIST -->

            <div id="commentsContainer">

                <div class="loading">
                    Loading comments...
                </div>

            </div>

        </section>

    </main>


    <!-- ================= FOOTER ================= -->

    <footer>

        <h3>
            BlogSpace
        </h3>

        <p>
            Share. Write. Connect.
        </p>

        <p>
            © 2026 BlogSpace. All rights reserved.
        </p>

    </footer>


    <!-- ================= JAVASCRIPT ================= -->

    <script src="js/post-details.js"></script>

</body>

</html>
